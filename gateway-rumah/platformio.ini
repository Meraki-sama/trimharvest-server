; TrimHarvest — Firmware Gateway Rumah (ESP32 DevKit)
; Lihat /PROTOCOL.md & /SECURITY.md di root repo untuk detail protokol &
; keamanan yang harus tetap sinkron dengan iot-node-sawah dan /server.
[env:esp32dev]
platform = espressif32
board = esp32dev
; ^ Board ESP32 DevKit generik (bukan T-Beam seperti node-sawah) -- gateway
;   TIDAK butuh sensor analog presisi tinggi/GPS/PMIC khusus seperti node,
;   cukup ESP32 biasa yang punya WiFi (untuk ke server) & modul LoRa
;   eksternal (untuk ke node sawah).
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    ; ^ Driver radio LoRa yang SAMA dengan node-sawah -- HARUS versi
    ;   library yang kompatibel di kedua sisi supaya perilaku radio
    ;   (parsing paket, dst) konsisten.
    bblanchon/ArduinoJson @ ^7.4.3
    ; ^ Untuk parsing/menyusun JSON body request ke server & command dari/
    ;   ke node -- CATATAN: gateway TIDAK butuh library ADC/OLED/PMIC
    ;   seperti node-sawah, karena gateway tidak punya sensor sendiri --
    ;   perannya murni sebagai JEMBATAN antara LoRa (ke node) dan WiFi/
    ;   HTTPS (ke server).
lib_ldf_mode = deep
