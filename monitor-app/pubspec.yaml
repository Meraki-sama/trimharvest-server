name: trimharvest_monitor
description: "TrimHarvest — kendali & pemantauan sawah/rumah (lihat /PROTOCOL.md di root repo untuk arsitektur lengkap)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  flutter_local_notifications: ^17.2.3
  # ^ Notifikasi lokal: popup peringatan di status bar HP saat ada
  #   kondisi tanaman menyimpang (tanah kering/basah, pupuk kurang/pekato,
  #   hama) -- lihat lib/services/notification_service.dart. Berjalan
  #   LOKAL di HP (tidak butuh server/FCM), cocok untuk monitoring
  #   pertanian rumahan.
  # ^ google_fonts: memuat font Poppins (rounded, ramah, gaptek-friendly)
  #   secara otomatis dari Google Fonts saat runtime, tanpa perlu bundle
  #   file .ttf manual ke folder fonts/. FontName di-set via
  #   `AppText.fontFamily = 'Poppins'` + `GoogleFonts.poppinsTextTheme()`
  #   (lihat theme.dart jika ingin diaktifkan eksplisit).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
