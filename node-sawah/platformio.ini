; TrimHarvest — Firmware Node Sawah (TTGO T-Beam)
; Lihat /SECURITY.md (root repo) & /PROTOCOL.md untuk penjelasan lengkap
; skema enkripsi/keamanan yang dipakai firmware ini.
;
; File ini adalah konfigurasi proyek PlatformIO -- alat build/dependency
; manager untuk firmware embedded (mirip peran package.json di proyek
; Node.js, tapi untuk C/C++ mikrokontroler).

[env:ttgo-t-beam]
; ^ "environment" bernama "ttgo-t-beam" -- satu file platformio.ini bisa
;   punya beberapa [env:...] untuk target board berbeda; proyek ini hanya
;   punya satu (board TTGO T-Beam, modul ESP32 dengan LoRa & GPS bawaan,
;   walau GPS-nya sendiri tidak dipakai di proyek ini).
platform = espressif32
; ^ Platform chip: keluarga ESP32 (Espressif) -- PlatformIO otomatis
;   mengunduh toolchain compiler (Xtensa GCC) yang sesuai.
board = ttgo-t-beam
; ^ Definisi board spesifik (pin mapping, clock speed, dst) sudah
;   disediakan PlatformIO untuk board populer ini.
framework = arduino
; ^ Pakai framework Arduino (API Serial, digitalWrite, dst yang familiar)
;   di atas ESP-IDF (SDK asli Espressif) -- lebih mudah ditulis, walau
;   kontrolnya tidak sedetail ESP-IDF native (lihat catatan Secure Boot/
;   Flash Encryption di /SECURITY.md).
monitor_speed = 115200
; ^ Baud rate Serial Monitor -- harus cocok dengan Serial.begin(115200)
;   di kode (lihat main.cpp), kalau tidak, output Serial akan tampil
;   sebagai karakter acak/rusak.
build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; ^ Matikan log debug internal framework Arduino-ESP32 (level 0 =
    ;   tidak ada log core) -- mengurangi noise di Serial Monitor supaya
    ;   log aplikasi sendiri (Serial.println di main.cpp dkk) lebih jelas
    ;   terbaca, dan sedikit mengurangi ukuran firmware.
lib_deps =
    ; ^ Daftar library eksternal yang di-fetch otomatis oleh PlatformIO
    ;   dari registry (mirip dependencies di package.json):
    sandeepmistry/LoRa @ ^0.8.0
    ; ^ Driver modul radio LoRa (chip SX127x) -- dipakai lora_node.cpp.
    adafruit/Adafruit ADS1X15 @ ^2.6.2
    ; ^ Driver ADC eksternal presisi tinggi ADS1115 (dipakai untuk membaca
    ;   sensor analog seperti TDS/kelembaban -- lihat sensors.cpp), karena
    ;   ADC bawaan ESP32 kurang presisi/linear untuk kebutuhan ini.
    bblanchon/ArduinoJson @ ^7.4.3
    ; ^ Library serialisasi/parsing JSON untuk mikrokontroler (efisien
    ;   memori, tanpa alokasi dinamis berlebihan) -- dipakai menyusun body
    ;   JSON sebelum dienkripsi (lihat /PROTOCOL.md 1.1).
    adafruit/Adafruit SSD1306 @ ^2.5.9
    ; ^ Driver layar OLED monokrom kecil (kemungkinan dipakai buat
    ;   menampilkan status/nilai sensor langsung di node, kalau board-nya
    ;   dipasangi layar OLED).
    adafruit/Adafruit GFX Library @ ^1.11.9
    ; ^ Library grafis dasar (gambar teks/bentuk) yang jadi dependency
    ;   Adafruit SSD1306 di atas.
    lewisxhe/XPowersLib @ ^0.2.6
    ; ^ Driver IC manajemen daya (PMIC) yang terpasang di board TTGO
    ;   T-Beam -- dipakai untuk membaca status baterai/charging secara
    ;   lebih akurat dibanding sekadar baca tegangan ADC mentah.
lib_ldf_mode = deep
; ^ "Library Dependency Finder" mode "deep" -- PlatformIO menelusuri
;   #include lebih menyeluruh (termasuk ke dalam sub-folder library) untuk
;   menentukan library mana saja yang benar-benar perlu di-compile,
;   berguna kalau struktur project/include-nya agak kompleks.
